





<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK CRICKET26</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#071b12;
    color:white;
    overflow:hidden;
}

/* TOP HEADER */
.header{
    height:70px;
    background:linear-gradient(90deg,#03140d,#08783d,#03140d);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:3px solid #ffd700;
    box-shadow:0 0 20px #000;
}

.logo{
    font-size:30px;
    font-weight:900;
    color:#ffd700;
    text-shadow:2px 2px 4px #000;
}

.logo span{
    color:white;
}

.scoreBox{
    display:flex;
    gap:30px;
    font-size:19px;
    font-weight:bold;
}

.scoreBox b{
    color:#ffd700;
}

/* GAME */
.game{
    height:calc(100vh - 70px);
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    width:min(1100px,96vw);
    height:min(620px,82vh);
    background:#178b3c;
    border:4px solid #d6d6d6;
    border-radius:10px;
    box-shadow:0 0 35px #000;
}

/* MENU */
.menu{
    position:absolute;
    background:rgba(0,0,0,.78);
    width:360px;
    padding:30px;
    border:2px solid #ffd700;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 35px #000;
}

.menu h1{
    color:#ffd700;
    font-size:38px;
    margin-bottom:8px;
}

.menu p{
    margin-bottom:22px;
    color:#ddd;
}

button{
    width:100%;
    border:0;
    border-radius:8px;
    padding:14px;
    margin:7px 0;
    background:linear-gradient(90deg,#ffd700,#ff9d00);
    color:#111;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
    filter:brightness(1.15);
}

.controls{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.65);
    padding:8px 18px;
    border-radius:20px;
    font-size:14px;
    color:#fff;
}

/* MOBILE */
@media(max-width:600px){
    .header{
        height:60px;
        padding:0 10px;
    }

    .logo{
        font-size:19px;
    }

    .scoreBox{
        gap:10px;
        font-size:12px;
    }

    .game{
        height:calc(100vh - 60px);
    }

    canvas{
        width:98vw;
        height:70vh;
    }

    .menu{
        width:85%;
    }

    .controls{
        font-size:11px;
        white-space:nowrap;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">AK <span>CRICKET26</span> 🏏</div>

    <div class="scoreBox">
        <div>RUNS: <b id="runs">0</b></div>
        <div>WKT: <b id="wickets">0</b></div>
        <div>OVER: <b id="overs">0.0</b></div>
    </div>
</div>

<div class="game">

<canvas id="gameCanvas" width="1100" height="620"></canvas>

<div class="menu" id="menu">
    <h1>AK CRICKET26</h1>
    <p>Ultimate Cricket Challenge</p>

    <button onclick="startGame()">START MATCH</button>
    <button onclick="showControls()">CONTROLS</button>
</div>

<div class="controls" id="controls">
    SPACE = SHOT &nbsp; | &nbsp;
    ← → = SHOT DIRECTION &nbsp; | &nbsp;
    R = RESTART
</div>

</div>

<script>

/* =========================================================
   AK CRICKET26
   SINGLE FILE HTML + CSS + JAVASCRIPT
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameRunning = false;
let ballFlying = false;

let runs = 0;
let wickets = 0;
let balls = 0;

let targetRuns = 100;

let ball = {
    x:550,
    y:140,
    z:0,
    speed:0
};

let batsman = {
    x:550,
    y:440,
    swing:false
};

let bowler = {
    x:550,
    y:130
};

let message = "";
let messageTimer = 0;

let shotDirection = 0;

let particles = [];

/* ==============================
   MENU
================================ */

function startGame(){

    runs = 0;
    wickets = 0;
    balls = 0;

    gameRunning = true;
    ballFlying = false;

    document.getElementById("menu").style.display="none";

    updateScore();
    resetBall();
}

function showControls(){

    alert(
        "AK CRICKET26 CONTROLS\n\n" +
        "SPACE = Batting Shot\n" +
        "LEFT ARROW = Shot Left\n" +
        "RIGHT ARROW = Shot Right\n" +
        "R = Restart Match"
    );
}

/* ==============================
   SCORE
================================ */

function updateScore(){

    document.getElementById("runs").innerText = runs;
    document.getElementById("wickets").innerText = wickets;

    let over = Math.floor(balls/6);
    let delivery = balls%6;

    document.getElementById("overs").innerText =
        over + "." + delivery;
}

/* ==============================
   RESET BALL
================================ */

function resetBall(){

    ballFlying = false;

    ball.x = bowler.x;
    ball.y = bowler.y + 25;
    ball.z = 0;

    setTimeout(()=>{

        if(gameRunning){
            ballFlying = true;
            ball.speed = 7;
        }

    },700);
}

/* ==============================
   BAT
================================ */

function playShot(){

    if(!gameRunning || !ballFlying) return;

    ballFlying = false;

    batsman.swing = true;

    setTimeout(()=>{
        batsman.swing = false;
    },300);

    let timing = Math.abs(ball.y - batsman.y);

    /* GOOD TIMING */
    if(timing < 45){

        let score;

        if(shotDirection === -1){
            score = Math.floor(Math.random()*3)+2;
        }
        else if(shotDirection === 1){
            score = Math.floor(Math.random()*4)+1;
        }
        else{
            score = Math.floor(Math.random()*5);
        }

        /* SIX */
        if(Math.random() < .12){
            score = 6;
            showMessage("SIX! 🔥");
            createParticles(550,350);
        }

        /* FOUR */
        else if(score >= 4){
            score = 4;
            showMessage("FOUR! 🏏");
            createParticles(550,350);
        }

        else{
            showMessage("GOOD SHOT!");
        }

        runs += score;
        balls++;

        updateScore();

        setTimeout(checkMatch,900);
    }

    /* BAD TIMING */
    else{

        if(Math.random() < .45){

            wickets++;

            balls++;

            showMessage("WICKET! ❌");

            updateScore();

            setTimeout(checkMatch,900);

        }else{

            runs += 0;
            balls++;

            showMessage("DOT BALL");

            updateScore();

            setTimeout(checkMatch,900);
        }
    }
}

/* ==============================
   MATCH CHECK
================================ */

function checkMatch(){

    if(wickets >= 10){

        endGame("ALL OUT!");
        return;
    }

    if(balls >= 120){

        endGame("20 OVERS COMPLETE!");
        return;
    }

    if(runs >= targetRuns){

        endGame("YOU WIN! 🏆");
        return;
    }

    resetBall();
}

/* ==============================
   END GAME
================================ */

function endGame(text){

    gameRunning = false;
    ballFlying = false;

    setTimeout(()=>{

        document.getElementById("menu").style.display="block";

        document.querySelector(".menu h1").innerText = text;

        document.querySelector(".menu p").innerText =
            "Final Score: " + runs + "/" + wickets +
            "   Overs: " + Math.floor(balls/6) +
            "." + balls%6;

    },500);
}

/* ==============================
   MESSAGE
================================ */

function showMessage(text){

    message = text;
    messageTimer = 100;
}

/* ==============================
   PARTICLES
================================ */

function createParticles(x,y){

    for(let i=0;i<40;i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random()-.5)*8,
            vy:(Math.random()-.5)*8,

            life:60
        });
    }
}

function updateParticles(){

    particles.forEach(p=>{

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

    });

    particles =
        particles.filter(p=>p.life>0);
}

function drawParticles(){

    particles.forEach(p=>{

        ctx.fillStyle =
            "rgba(255,215,0,"+(p.life/60)+")";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

    });
}

/* ==============================
   GROUND
================================ */

function drawGround(){

    /* Grass */
    ctx.fillStyle="#16833a";
    ctx.fillRect(0,0,1100,620);

    /* Grass stripes */

    for(let i=0;i<1100;i+=80){

        ctx.fillStyle =
            i%160===0
            ? "#188b3e"
            : "#147b36";

        ctx.fillRect(i,0,80,620);
    }

    /* Boundary */

    ctx.strokeStyle="#fff";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.ellipse(
        550,
        310,
        500,
        270,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    /* Pitch */

    ctx.fillStyle="#c8a56a";

    ctx.fillRect(
        430,
        100,
        240,
        420
    );

    /* Pitch lines */

    ctx.strokeStyle="#fff";
    ctx.lineWidth=4;

    ctx.strokeRect(
        430,
        100,
        240,
        420
    );

    /* Crease */

    ctx.beginPath();

    ctx.moveTo(430,170);
    ctx.lineTo(670,170);

    ctx.moveTo(430,450);
    ctx.lineTo(670,450);

    ctx.stroke();

    /* Wickets */

    drawWicket(550,165);
    drawWicket(550,455);
}

/* ==============================
   WICKET
================================ */

function drawWicket(x,y){

    ctx.strokeStyle="#fff";
    ctx.lineWidth=6;

    for(let i=-1;i<=1;i++){

        ctx.beginPath();

        ctx.moveTo(x+i*10,y-20);
        ctx.lineTo(x+i*10,y+20);

        ctx.stroke();
    }

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(x-10,y-15);
    ctx.lineTo(x+10,y-15);

    ctx.moveTo(x-10,y+15);
    ctx.lineTo(x+10,y+15);

    ctx.stroke();
}

/* ==============================
   PLAYER
================================ */

function drawPlayer(x,y,team){

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+35,
        22,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* legs */

    ctx.strokeStyle="#111";
    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(x-7,y+15);
    ctx.lineTo(x-10,y+35);

    ctx.moveTo(x+7,y+15);
    ctx.lineTo(x+10,y+35);

    ctx.stroke();

    /* body */

    ctx.fillStyle =
        team==="blue"
        ? "#0b54c7"
        : "#111";

    ctx.fillRect(
        x-15,
        y-10,
        30,
        30
    );

    /* head */

    ctx.fillStyle="#c98252";

    ctx.beginPath();

    ctx.arc(
        x,
        y-25,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* helmet */

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        x,
        y-28,
        13,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();
}

/* ==============================
   BATSMAN
================================ */

function drawBatsman(){

    drawPlayer(
        batsman.x,
        batsman.y,
        "blue"
    );

    /* bat */

    ctx.strokeStyle="#e5c17a";
    ctx.lineWidth=10;

    ctx.beginPath();

    if(batsman.swing){

        ctx.moveTo(
            batsman.x+10,
            batsman.y
        );

        ctx.lineTo(
            batsman.x+55,
            batsman.y-45
        );

    }else{

        ctx.moveTo(
            batsman.x+10,
            batsman.y
        );

        ctx.lineTo(
            batsman.x+25,
            batsman.y-45
        );
    }

    ctx.stroke();
}

/* ==============================
   BOWLER
================================ */

function drawBowler(){

    drawPlayer(
        bowler.x,
        bowler.y,
        "red"
    );
}

/* ==============================
   BALL
================================ */

function drawBall(){

    ctx.fillStyle="#d71920";

    ctx.shadowColor="#000";
    ctx.shadowBlur=8;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    /* seam */

    ctx.strokeStyle="#fff";
    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        6,
        0,
        Math.PI
    );

    ctx.stroke();
}

/* ==============================
   FIELDERS
================================ */

function drawFielders(){

    const fielders = [

        [270,150],
        [820,150],
        [180,300],
        [920,300],
        [250,500],
        [850,500],
        [330,80],
        [770,80],
        [150,430],
        [950,430]
    ];

    fielders.forEach(pos=>{

        drawPlayer(
            pos[0],
            pos[1],
            "red"
        );

    });
}

/* ==============================
   STADIUM
================================ */

function drawStadium(){

    /* crowd */

    ctx.fillStyle="#222";

    ctx.fillRect(
        0,
        0,
        1100,
        45
    );

    ctx.fillRect(
        0,
        575,
        1100,
        45
    );

    /* crowd dots */

    for(let i=0;i<160;i++){

        let x=Math.random()*1100;

        let y =
            Math.random()<.5
            ? Math.random()*40
            : 580+Math.random()*40;

        ctx.fillStyle =
            ["#ff3333","#fff","#ffd700","#22aaff"]
            [Math.floor(Math.random()*4)];

        ctx.fillRect(x,y,4,4);
    }

    /* flood lights */

    drawLight(60,60);
    drawLight(1040,60);
}

function drawLight(x,y){

    ctx.fillStyle="#ddd";

    ctx.fillRect(
        x-5,
        y,
        10,
        100
    );

    ctx.fillStyle="#fff";

    for(let i=0;i<5;i++){

        ctx.beginPath();

        ctx.arc(
            x-20+i*10,
            y,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* ==============================
   BALL MOVEMENT
================================ */

function updateBall(){

    if(!ballFlying) return;

    ball.y += ball.speed;

    /* slight curve */

    ball.x =
        550 +
        Math.sin(ball.y/50)*5;

    if(ball.y >= batsman.y-15){

        ballFlying = false;

        /* automatic miss if player doesn't hit */

        if(Math.random()<.25){

            wickets++;
            balls++;

            showMessage("WICKET!");

            updateScore();

            setTimeout(checkMatch,800);

        }else{

            balls++;

            showMessage("DOT BALL");

            updateScore();

            setTimeout(checkMatch,800);
        }
    }
}

/* ==============================
   DRAW
================================ */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawStadium();
    drawGround();
    drawFielders();
    drawBowler();
    drawBatsman();

    if(ballFlying){
        drawBall();
    }

    drawParticles();

    /* message */

    if(messageTimer>0){

        ctx.fillStyle="#ffd700";
        ctx.font="bold 42px Arial";
        ctx.textAlign="center";

        ctx.shadowColor="#000";
        ctx.shadowBlur=8;

        ctx.fillText(
            message,
            550,
            90
        );

        ctx.shadowBlur=0;

        messageTimer--;
    }

    /* Target */

    if(gameRunning){

        ctx.fillStyle="rgba(0,0,0,.55)";
        ctx.fillRect(
            15,
            55,
            180,
            45
        );

        ctx.fillStyle="#fff";
        ctx.font="bold 16px Arial";
        ctx.textAlign="left";

        ctx.fillText(
            "TARGET: "+targetRuns,
            30,
            83
        );
    }

    updateBall();
    updateParticles();

    requestAnimationFrame(draw);
}

/* ==============================
   KEYBOARD
================================ */

document.addEventListener(
    "keydown",
    function(e){

        if(e.code==="Space"){

            e.preventDefault();

            playShot();
        }

        if(e.key==="ArrowLeft"){

            shotDirection=-1;
        }

        if(e.key==="ArrowRight"){

            shotDirection=1;
        }

        if(e.key.toLowerCase()==="r"){

            startGame();
        }
    }
);

/* ==============================
   TOUCH
================================ */

canvas.addEventListener(
    "touchstart",
    function(){

        playShot();

    }
);

/* ==============================
   START DRAW LOOP
================================ */

draw();

</script>

</body>
</html>
