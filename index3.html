<html>
<head>
<title>annu catch game</title>

<style>
body {
	text-align:center;
	font-family:arial;
	background:lightblue;

}	
#game{
	width: 350px;
	height: 400px;
	margin: auto;
	background: white;
	border: 3px solid black;
	position: relative;

}
#mybutton{
	position: absolute;
	background: red;
	color: white;
	border: none;
	padding: 12px;
	border-radius: 10px;
	cursor: pointer;

}
</style>
</head>

<body>

	<h1>annu catch game</h1>
	<h2>score:<span id="score">0</span></h2>
	<div id="game">
	<button id="mybutton"
	onclick="catchbutton()">click me!</button>
	</div>

	<script>
	let score=0;
	function catchbutton() {
		score=score + 1;
			
	document.getElementById("score").innerText=score;
	let btn=document.getElementById("mybutton");
	let X= math.random()*280;
	let Y=math.random()	*330;
	btn.style.left=X+"px";
	btn.style.top=Y+"px";

		}
		</script>
		</body>
		</html>
